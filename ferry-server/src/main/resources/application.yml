server:
  port: ${FERRY_PORT:8095}
  # Listen on this machine only: the server has no login yet. Set FERRY_BIND=0.0.0.0 to open it to the network on purpose.
  address: ${FERRY_BIND:127.0.0.1}

spring:
  application:
    name: data-migration-ferry
  servlet:
    multipart:
      # Dry Dock reads whole database dumps (it skips the data rows); Boarding keeps its own 200 MB cap.
      max-file-size: 4GB
      max-request-size: 8GB
  # The embedded run store and ID register are built in core/DataSourceConfig from ferry.data-dir
  # (a git-ignored folder, because it can hold customer data).
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

ferry:
  version: 0.1.0
  config-dir: ${FERRY_CONFIG_DIR:../config}
  data-dir: ${FERRY_DATA_DIR:./data}
  # Blank means: use "active" from environments.json
  environment: ${FERRY_ENV:}
  cors-origin: ${FERRY_CONSOLE_ORIGIN:http://localhost:5196}

logging:
  level:
    com.dataferry: INFO
